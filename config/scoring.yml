# 스코어링 튜닝값 단일 소재지 (AD-4). 값은 잠정 기본(PRD §13 ASSUMPTION) — 본개발 실측으로 확정한다.
# 코드는 이 파일만 Scoring::Config 로 읽는다. 상수 하드코딩 금지.
baseline:
  sample_size_n: 25          # 채널·유형별 최근 N개 공개 영상(중앙값 표본). PRD 기본 20~30 (본개발 실측 튜닝)
  min_sample_for_confidence: 10  # 유형별 최근 공개 영상 이 수 미만이면 low_confidence (본개발 실측 튜닝)
performance:
  view_floor_fixed: 300      # 조회수 하한 = max(고정, k×기준선). 자사 공개 200~4,100 정당 대박 보호 (본개발 실측 튜닝)
  view_floor_k: 0.1          # (본개발 실측 튜닝)
  extreme_multiple: 25       # >25x "검증 요망" 플래그 (본개발 실측 튜닝)
  multiple_presets: [2, 3, 5, 10, 25]  # 필터 프리셋 (본개발 실측 튜닝)
evergreen:
  min_age_days: 180          # 나이 임계 AND 배수 임계 동시 충족 (본개발 실측 튜닝)
  min_multiple: 2            # (본개발 실측 튜닝)
similarity:
  tau: 0.8                   # 코사인 임계(FR-17, 주제 묶기 재사용). 고정 0.8 맹신 금지 (본개발 실측 튜닝)
opportunity_score:
  weights:                   # 4입력 가중합(투명). 초기 등가, 피드백으로 조정 (본개발 실측 튜닝)
    performance_signal: 0.25
    competitor_commonality: 0.25
    content_gap: 0.25
    recency: 0.25
  normalization: {}          # 각 입력 [0,1] 정규화 매핑 자리 (본개발 확정)
subscriber_bands: [10000, 100000, 500000]  # <1만 / 1만~10만 / 10만~50만 / 50만+ (본개발 실측 튜닝)
cold_start_snapshots:        # 위젯별 "수집 중"→표시 전환 스냅샷 수 (본개발 실측 튜닝)
  sparkline: 7
  vpd: 2
  evergreen_validation: 14
  subscriber_delta: 7
is_short:
  max_duration_seconds: 180  # duration 휴리스틱 임계(ClassifyShort 1회 판정). 본개발 확정
