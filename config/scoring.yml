# 스코어링 튜닝값 단일 소재지 (AD-4). 값은 잠정 기본(PRD §13 ASSUMPTION) — 본개발 실측으로 확정한다.
# 코드는 이 파일만 Scoring::Config 로 읽는다. 상수 하드코딩 금지.
baseline:
  sample_size_n: 25          # 채널·유형별 최근 N개 공개 영상(중앙값 표본). PRD 기본 20~30 (본개발 실측 튜닝)
  min_sample_for_confidence: 10  # 유형별 최근 공개 영상 이 수 미만이면 low_confidence (본개발 실측 튜닝)
performance:
  view_floor_fixed: 300      # 조회수 하한 = max(고정, k×기준선). 자사 공개 200~4,100 정당 대박 보호 (본개발 실측 튜닝)
  view_floor_k: 0.1          # (본개발 실측 튜닝)
  extreme_multiple: 25       # >25x "검증 요망" 플래그 (본개발 실측 튜닝)
  multiple_presets: [2, 3, 5, 10, 25]  # 필터 프리셋 (본개발 실측 튜닝)
evergreen:
  min_age_days: 180          # 나이 임계 AND 배수 임계 동시 충족 (본개발 실측 튜닝)
  min_multiple: 2            # (본개발 실측 튜닝)
similarity:
  tau: 0.8                   # 자사 유사영상(OwnVideoMatch) 매칭 임계 — "이미 비슷한 걸 만들었나". (본개발 실측 튜닝)
  cluster_tau: 0.88          # 주제 클러스터링(리더/중심) 임계. 단일연결 체이닝(메가클러스터) 방지 위해 상향.
                             #   실측(경쟁 5채널 1,791영상): SL τ0.8 → max 990(전체 55%) 메가클러스터.
                             #   leader τ0.88 → max 31·커버 28%·139클러스터, 응집 양호. (본개발 실측 튜닝)
content_gap:
  saturation_min: 3          # OwnVideoMatch 이 수 이상이면 '포화'. 2~(this-1)=유사영상 2개+, 1=유사영상 1개, 0=미제작 (본개발 실측 튜닝)
opportunity_score:
  weights:                   # 4입력 가중합(투명). 실측 재보정 — 기획 도구라 성과·갭을 무겁게, 공통성은 낮게(롱폼은 채널 수가 적어 과패널티).
    performance_signal: 0.35
    competitor_commonality: 0.15
    content_gap: 0.30
    recency: 0.20
  normalization:             # 각 입력 [0,1] 정규화 매핑 (FR-21 구조 고정, 값은 실측 재보정)
    performance_divisor: 8   # 성과 배수 → min(배수/divisor, 1). 8배면 만점 (실측 재보정)
    commonality_cap: 2       # 경쟁 공통성 → min(경쟁 채널 수/cap, 1). 2채널이면 만점 — 실데이터(주제당 1~2채널)에 맞춤 (실측 재보정)
    recency_full_decay_days: 180  # 최신성 선형 감쇠 → 경과일 이 값 이상이면 하한까지 (실측 재보정)
    recency_floor: 0.3       # 최신성 하한 — 오래된(에버그린) 주제를 0으로 죽이지 않게 최소 신뢰 (실측 재보정)
    content_gap_values:      # 콘텐츠 갭 버킷 → [0,1] (미제작=최대 기회) (본개발 실측 튜닝)
      not_made: 1.0
      one: 0.66
      few: 0.33
      saturated: 0.0
subscriber_bands: [10000, 100000, 500000]  # <1만 / 1만~10만 / 10만~50만 / 50만+ (본개발 실측 튜닝)
subscriber_delta:            # 경쟁 채널 구독자 증감(6.4) 정직성 임계
  min_material_pct: 0.5      # |7일 증감%| 이 값 미만이면 "측정한계"(§4.7) — YouTube 반올림 노이즈 컷 (본개발 실측 튜닝)
  bar_full_pct: 5.0          # 미니 진행 바 100% 기준 증감%(표시 스케일, 데이터 아님) (본개발 실측 튜닝)
cold_start_snapshots:        # 위젯별 "수집 중"→표시 전환 스냅샷 수 (본개발 실측 튜닝)
  sparkline: 7
  vpd: 2
  evergreen_validation: 14
  subscriber_delta: 7
is_short:
  max_duration_seconds: 180  # duration 휴리스틱 임계(ClassifyShort 1회 판정). 본개발 확정
recommendation:
  max_count: 3               # 추천 주제 최대 수(FR-19 "3개"). 자격 주제 부족 시 그 수만 생성(정직성 AD-16)
